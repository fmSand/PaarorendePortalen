name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # Deterministic build metadata (normalised paths, embedded commit).
      ContinuousIntegrationBuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Parorendeportalen.slnx --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check src tests

      - name: Build
        run: dotnet build Parorendeportalen.slnx --configuration Release --no-restore -warnaserror

      # Repository/service tests start a throwaway PostgreSQL container via Testcontainers
      - name: Test
        run: |
          dotnet test Parorendeportalen.slnx \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**
          retention-days: 7
