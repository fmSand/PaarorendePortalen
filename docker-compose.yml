services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: parorendeportalen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parorendeportalen"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
